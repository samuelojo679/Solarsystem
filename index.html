<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Solar System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="solar-system">

        <h1 class="title">The Solar System</h1>

        <div class="orbit orbit-1"></div>
        <div class="orbit orbit-2"></div>
        <div class="orbit orbit-3"></div>
        <div class="orbit orbit-4"></div>
        <div class="orbit orbit-5"></div>
        <div class="orbit orbit-6"></div>
        <div class="orbit orbit-7"></div>
        <div class="orbit orbit-8"></div>

        <div class="sun">
            <img src="image/sun.png" alt="Sun">
            <span>Sun</span>
        </div>

        <div class="planet mercury">
            <img src="image/mercury.png" alt="Mercury">
            <span>Mercury</span>
        </div>

        <div class="planet venus">
            <img src="image/venus.png" alt="Venus">
            <span>Venus</span>
        </div>

        <div class="planet earth">
            <img src="image/earth.png" alt="Earth">
            <span>Earth</span>
        </div>

        <div class="planet mars">
            <img src="image/mars.png" alt="Mars">
            <span>Mars</span>
        </div>

        <div class="planet jupiter">
            <img src="image/jupiter.png" alt="Jupiter">
            <span>Jupiter</span>
        </div>

        <div class="planet saturn">
            <img src="image/saturn.png" alt="Saturn">
            <span>Saturn</span>
        </div>

        <div class="planet uranus">
            <img src="image/uranus.png" alt="Uranus">
            <span>Uranus</span>
        </div>

        <div class="planet neptune">
            <img src="image/neptune.png" alt="Neptune">
            <span>Neptune</span>
        </div>

    </main>

</body>
</html>
